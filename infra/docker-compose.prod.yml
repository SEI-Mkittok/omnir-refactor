version: "3.9"

# Production compose — used on staging/prod servers
# Images pulled from GHCR (set REGISTRY and IMAGE_TAG in environment)
# Secrets injected from environment or Docker secrets

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not exposed externally in prod
    expose:
      - "5432"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: omnir-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"   # MailHog web UI — http://staging.omnir.local:8025
    expose:
      - "1025"        # SMTP (internal only)

  minio:
    image: minio/minio:latest
    container_name: omnir-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-omnir}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin-staging}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    ports:
      - "9001:9001"   # MinIO console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    image: ${REGISTRY:-ghcr.io}/${API_IMAGE}:${IMAGE_TAG:-develop}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
      ENV: production
      LOG_LEVEL: info
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEQUENCE_TOKEN_SECRET: ${SEQUENCE_TOKEN_SECRET}
      EMAIL_INBOX_ENCRYPTION_KEY: ${EMAIL_INBOX_ENCRYPTION_KEY}
      SSO_ENCRYPTION_KEY: ${SSO_ENCRYPTION_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      INTEGRATION_CREDENTIALS_ENCRYPTION_KEY: ${INTEGRATION_CREDENTIALS_ENCRYPTION_KEY}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-omnir-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-omnir}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin-staging}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    image: ${REGISTRY:-ghcr.io}/${FRONTEND_IMAGE}:${IMAGE_TAG:-develop}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro  # mount TLS certs

  # Create default S3 bucket on deploy (idempotent)
  # Use: docker compose --profile minio-init run --rm minio-init
  minio-init:
    image: minio/mc:latest
    profiles: ["minio-init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-omnir}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin-staging}
      S3_BUCKET: ${S3_BUCKET:-omnir-attachments}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
        mc mb --ignore-existing local/$$S3_BUCKET &&
        echo "Bucket $$S3_BUCKET ready"
    restart: "no"

  # Migrations run as a one-shot container on deploy
  # Use: docker compose --profile migration run --rm migrate
  migrate:
    image: ${REGISTRY:-ghcr.io}/${API_IMAGE}:${IMAGE_TAG:-develop}
    profiles: ["migration"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    entrypoint: ["/goose"]
    command: ["-dir", "/migrations", "-allow-missing", "postgres", "${DATABASE_URL}", "up"]
    restart: "no"

  # Seed staging test users after migrations (idempotent upsert)
  # Use: docker compose --profile seed run --rm seed-staging
  seed-staging:
    image: postgres:16-alpine
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./scripts/seed-staging.sh:/seed-staging.sh:ro
    entrypoint: ["/bin/sh", "/seed-staging.sh"]
    restart: "no"

volumes:
  postgres_data:
  minio_data:
