version: "3.9"

# Test override — spins up isolated test DB
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up --abort-on-container-exit

services:
  postgres:
    environment:
      POSTGRES_DB: omnir_crm_test
    ports:
      - "5433:5432"   # different port to avoid conflicts with dev DB

  api:
    environment:
      DATABASE_URL: postgres://omnir:omnir_dev@postgres:5432/omnir_crm_test?sslmode=disable
      ENV: test
    command: ["go", "test", "./...", "-v", "-count=1"]
    depends_on:
      postgres:
        condition: service_healthy
