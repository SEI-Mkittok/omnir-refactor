name: Deploy — Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: sei-mkittok/omnir-refactor/omnir-api
  FRONTEND_IMAGE: sei-mkittok/omnir-refactor/web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      api_tag: ${{ steps.meta-api.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          target: production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build & push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=/api/v1
            VITE_AUTH_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: [self-hosted, omnir-staging]
    needs: build-and-push
    environment:
      name: staging
      url: http://100.73.134.90

    steps:
      - uses: actions/checkout@v4

      - name: Sync prod compose and scripts to deploy dir
        run: |
          cp $GITHUB_WORKSPACE/infra/docker-compose.prod.yml ~/omnir-crm/docker-compose.prod.yml
          mkdir -p ~/omnir-crm/scripts
          cp $GITHUB_WORKSPACE/scripts/seed-staging.sh ~/omnir-crm/scripts/seed-staging.sh
          chmod +x ~/omnir-crm/scripts/seed-staging.sh

      - name: Log in to GHCR (isolated — does not touch ~/.docker/config.json)
        env:
          # Use a temp dir so CI auth never overwrites the persistent PAT
          # stored in ~/.docker/config.json by the omnirdev user.
          DOCKER_CONFIG: /tmp/ci-docker-config-${{ github.run_id }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest images
        env:
          DOCKER_CONFIG: /tmp/ci-docker-config-${{ github.run_id }}
        run: |
          cd ~/omnir-crm
          docker compose -f docker-compose.prod.yml pull

      - name: Deploy
        env:
          DOCKER_CONFIG: /tmp/ci-docker-config-${{ github.run_id }}
        run: |
          cd ~/omnir-crm
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Run migrations
        run: |
          cd ~/omnir-crm
          docker compose -f docker-compose.prod.yml --profile migration run --rm migrate

      - name: Seed staging test users (idempotent)
        run: |
          cd ~/omnir-crm
          docker compose -f docker-compose.prod.yml --profile seed run --rm seed-staging

      - name: Create S3 bucket (idempotent)
        run: |
          cd ~/omnir-crm
          docker compose -f docker-compose.prod.yml --profile minio-init run --rm minio-init

      - name: Remove leftover one-shot containers
        if: always()
        run: |
          cd ~/omnir-crm
          docker compose -f docker-compose.prod.yml --profile migration rm -f migrate 2>/dev/null || true
          docker compose -f docker-compose.prod.yml --profile seed rm -f seed-staging 2>/dev/null || true
          docker compose -f docker-compose.prod.yml --profile minio-init rm -f minio-init 2>/dev/null || true

      - name: Clean up CI docker auth (leave persistent PAT intact)
        if: always()
        run: rm -rf /tmp/ci-docker-config-${{ github.run_id }}

      - name: Cleanup old images
        run: docker system prune -f

      - name: Smoke test
        run: |
          sleep 10
          curl -f http://localhost:8080/health || exit 1
          echo "Staging deploy OK"
