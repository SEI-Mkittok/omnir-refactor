name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Go API — lint + test + build
  # ─────────────────────────────────────────────────────────────────
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnir
          POSTGRES_PASSWORD: omnir_dev
          POSTGRES_DB: omnir_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            api/go.sum
            api/vendor/modules.txt

      - name: Use vendored modules when present
        run: |
          if [ -f vendor/modules.txt ]; then
            echo "GOFLAGS=-mod=vendor" >> "$GITHUB_ENV"
            echo "Using vendored Go modules (api/vendor)"
          fi

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: latest
          working-directory: api
          args: --timeout 5m

      - name: Run tests
        env:
          DATABASE_URL: postgres://omnir:omnir_dev@localhost:5432/omnir_crm_test?sslmode=disable
          JWT_SECRET: ci-test-secret
          ENV: test
        run: |
          go test ./... -v -count=1 -race -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Run migrations for integration tests
        working-directory: api
        env:
          PGPASSWORD: omnir_dev
        run: |
          for f in $(ls migrations/*.sql | sort); do
            awk 'BEGIN{p=0} /^-- \+goose Up/{p=1;next} /^-- \+goose Down/{p=0;next} /^-- \+goose/{next} p{print}' "$f" \
              | psql -h localhost -U omnir -d omnir_crm_test -v ON_ERROR_STOP=1
          done


      - name: API integration tests
        working-directory: api
        env:
          DATABASE_URL: postgres://omnir:omnir_dev@localhost:5432/omnir_crm_test?sslmode=disable
          TEST_DATABASE_URL: postgres://omnir:omnir_dev@localhost:5432/omnir_crm_test?sslmode=disable
          ORG_MODE: multitenant
        run: go test -tags integration ./internal/repository/postgres/... -v -count=1

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage.out
          flags: api
        continue-on-error: true

      - name: Build binary
        run: go build -o /dev/null ./cmd/server

  # ─────────────────────────────────────────────────────────────────
  # React Frontend — lint + type-check + test + build
  # ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run
        continue-on-error: true

      - name: Build
        env:
          VITE_API_URL: /api/v1
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: web/dist
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────
  # Docker build validation
  # ─────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [api, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
