# Air config — hot reload for Go API in dev
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  delay = 500
  exclude_dir = ["tmp", "vendor", "testdata"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_regex = ["_test.go"]
  kill_delay = "500ms"
  rerun = false
  rerun_delay = 500
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = false

[color]
  build   = "yellow"
  main    = "magenta"
  runner  = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = true
