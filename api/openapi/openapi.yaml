openapi: 3.1.0
info:
  title: Omnir CRM API
  version: 0.1.0
  description: |
    REST API for Omnir CRM — the modern replacement for vtiger CE.
    Built in Go, PostgreSQL-backed, JWT-authenticated.
  contact:
    name: Omnir Engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080/api/v1
    description: Local dev
  - url: https://api.omnir.io/api/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: contacts
    description: CRM contacts
  - name: accounts
    description: Company accounts
  - name: deals
    description: Sales deals / pipeline
  - name: activities
    description: Tasks, calls, meetings, emails
  - name: pipelines
    description: Deal pipeline configuration
  - name: search
    description: Unified search
  - name: module-configuration
    description: CRM module layouts and relationship configuration

paths:

  # ─── AUTH ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke refresh token
      responses:
        '204':
          description: Logged out

  /auth/me:
    get:
      tags: [auth]
      summary: Get current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ─── USERS ─────────────────────────────────────────────────────────────────

  /users:
    get:
      tags: [users]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [users]
      summary: Get user by ID
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [users]
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [users]
      summary: Delete user
      responses:
        '204':
          description: Deleted

  # ─── CONTACTS ──────────────────────────────────────────────────────────────

  /contacts:
    get:
      tags: [contacts]
      summary: List contacts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/OwnerId'
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/ContactStage'
        - name: account_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
    post:
      tags: [contacts]
      summary: Create contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '201':
          description: Created contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/LinkedPage'
      - $ref: '#/components/parameters/LinkedLimit'
      - $ref: '#/components/parameters/LinkedType'
      - $ref: '#/components/parameters/LinkedRole'
      - $ref: '#/components/parameters/LinkedSince'
    get:
      tags: [contacts]
      summary: Get contact
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [contacts]
      summary: Update contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPatch'
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
    delete:
      tags: [contacts]
      summary: Delete contact
      responses:
        '204':
          description: Deleted

  /contacts/{id}/activities:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [contacts]
      summary: List activities for a contact
      responses:
        '200':
          description: Activity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'

  /contacts/{id}/deals:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [contacts]
      summary: List deals for a contact
      responses:
        '200':
          description: Deal list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealList'

  /contacts/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [contacts]
      summary: List notes for a contact
      responses:
        '200':
          description: Note list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
    post:
      tags: [contacts]
      summary: Add a note to a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Created note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

  # ─── ACCOUNTS ──────────────────────────────────────────────────────────────

  /accounts:
    get:
      tags: [accounts]
      summary: List accounts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/OwnerId'
      responses:
        '200':
          description: Paginated accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
    post:
      tags: [accounts]
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/LinkedPage'
      - $ref: '#/components/parameters/LinkedLimit'
      - $ref: '#/components/parameters/LinkedType'
      - $ref: '#/components/parameters/LinkedRole'
      - $ref: '#/components/parameters/LinkedSince'
    get:
      tags: [accounts]
      summary: Get account
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [accounts]
      summary: Update account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    delete:
      tags: [accounts]
      summary: Delete account
      responses:
        '204':
          description: Deleted

  /accounts/{id}/contacts:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [accounts]
      summary: List contacts for an account
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'

  /accounts/{id}/deals:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [accounts]
      summary: List deals for an account
      responses:
        '200':
          description: Deal list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealList'

  /accounts/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [accounts]
      summary: List notes for an account
      responses:
        '200':
          description: Note list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
    post:
      tags: [accounts]
      summary: Add a note to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Created note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

  # ─── DEALS ─────────────────────────────────────────────────────────────────

  /deals:
    get:
      tags: [deals]
      summary: List deals
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/OwnerId'
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/DealStage'
        - name: pipeline_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated deals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealList'
    post:
      tags: [deals]
      summary: Create deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealCreate'
      responses:
        '201':
          description: Created deal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'

  /deals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [deals]
      summary: Get deal
      responses:
        '200':
          description: Deal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [deals]
      summary: Update deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealPatch'
      responses:
        '200':
          description: Updated deal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
    delete:
      tags: [deals]
      summary: Delete deal
      responses:
        '204':
          description: Deleted

  /deals/{id}/activities:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [deals]
      summary: List activities for a deal
      responses:
        '200':
          description: Activity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'

  /deals/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [deals]
      summary: List notes for a deal
      responses:
        '200':
          description: Note list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
    post:
      tags: [deals]
      summary: Add a note to a deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Created note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

  # ─── ACTIVITIES ────────────────────────────────────────────────────────────

  /activities:
    get:
      tags: [activities]
      summary: List activities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/OwnerId'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ActivityType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActivityStatus'
      responses:
        '200':
          description: Paginated activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
    post:
      tags: [activities]
      summary: Create activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
      responses:
        '201':
          description: Created activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'

  /activities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [activities]
      summary: Get activity
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
    patch:
      tags: [activities]
      summary: Update activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityPatch'
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
    delete:
      tags: [activities]
      summary: Delete activity
      responses:
        '204':
          description: Deleted

  # ─── PIPELINES ─────────────────────────────────────────────────────────────

  /pipelines:
    get:
      tags: [pipelines]
      summary: List pipelines
      responses:
        '200':
          description: All pipelines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pipeline'
    post:
      tags: [pipelines]
      summary: Create pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineCreate'
      responses:
        '201':
          description: Created pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'

  /pipelines/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [pipelines]
      summary: Get pipeline
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
    patch:
      tags: [pipelines]
      summary: Update pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelinePatch'
      responses:
        '200':
          description: Updated pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
    delete:
      tags: [pipelines]
      summary: Delete pipeline
      responses:
        '204':
          description: Deleted

  /pipelines/{id}/deals:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [pipelines]
      summary: Get deals grouped by stage for a pipeline
      responses:
        '200':
          description: Deals by stage
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/Deal'

  # ─── SEARCH ────────────────────────────────────────────────────────────────

  /search:
    get:
      tags: [search]
      summary: Unified search across entities
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: types
          in: query
          description: Comma-separated entity types to include
          schema:
            type: string
            example: contacts,accounts,deals
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'

  # ─── MODULE CONFIGURATION ─────────────────────────────────────────────────

  /module-layouts/{entityType}:
    parameters:
      - $ref: '#/components/parameters/EntityType'
    get:
      tags: [module-configuration]
      summary: Get the effective runtime layout for a CRM module
      description: Authenticated users need read access to the requested CRM module.
      responses:
        '200':
          description: Runtime module layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleLayout'
        '403':
          $ref: '#/components/responses/Unauthorized'

  /settings/module-layouts/{entityType}:
    parameters:
      - $ref: '#/components/parameters/EntityType'
    get:
      tags: [module-configuration]
      summary: Get the admin-editable layout for a CRM module
      responses:
        '200':
          description: Admin module layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleLayout'
    put:
      tags: [module-configuration]
      summary: Save a CRM module layout
      description: Requires settings admin/write access. Layout overlays custom-field presentation and does not replace custom-field definitions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocks]
              properties:
                blocks:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModuleLayoutBlock'
      responses:
        '200':
          description: Saved module layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleLayout'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /settings/module-layouts/{entityType}/reset:
    parameters:
      - $ref: '#/components/parameters/EntityType'
    post:
      tags: [module-configuration]
      summary: Reset a CRM module layout to generated defaults
      responses:
        '200':
          description: Default module layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleLayout'

  /module-relationships:
    get:
      tags: [module-configuration]
      summary: List enabled runtime relationship definitions for a module
      parameters:
        - $ref: '#/components/parameters/EntityTypeQuery'
      responses:
        '200':
          description: Enabled relationship definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleRelationshipDefinition'

  /settings/module-relationships:
    get:
      tags: [module-configuration]
      summary: List admin relationship definitions
      parameters:
        - $ref: '#/components/parameters/EntityTypeQueryOptional'
      responses:
        '200':
          description: Relationship definitions, including system metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleRelationshipDefinition'
    put:
      tags: [module-configuration]
      summary: Create or update a relationship definition
      description: System relationships keep native storage; custom relationships use crm_entity_links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleRelationshipDefinition'
      responses:
        '200':
          description: Saved relationship definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleRelationshipDefinition'
        '409':
          description: Existing links prevent destructive relationship shape changes
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /settings/module-relationships/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [module-configuration]
      summary: Delete a custom relationship definition
      description: System definitions and definitions with existing links cannot be deleted.
      responses:
        '204':
          description: Deleted
        '409':
          description: Definition has existing links
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /entity-links/{entityType}/{entityID}:
    parameters:
      - $ref: '#/components/parameters/EntityType'
      - name: entityID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: relationship_definition_id
        in: query
        schema:
          type: string
          format: uuid
    get:
      tags: [module-configuration]
      summary: List readable generic links for an entity
      description: Results omit links whose opposite endpoint is not readable by the caller.
      responses:
        '200':
          description: Filtered entity links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CRMEntityLink'

  /entity-links:
    post:
      tags: [module-configuration]
      summary: Create a generic custom relationship link
      description: Requires write access to both endpoint records and an enabled crm_entity_links relationship definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCRMEntityLinkRequest'
      responses:
        '201':
          description: Created entity link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRMEntityLink'
        '409':
          description: Duplicate or cardinality conflict
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /entity-links/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [module-configuration]
      summary: Delete a generic custom relationship link
      description: Requires write access to both endpoint records.
      responses:
        '204':
          description: Deleted

# ─── COMPONENTS ──────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Q:
      name: q
      in: query
      schema:
        type: string
    EntityType:
      name: entityType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CustomFieldEntityType'
    EntityTypeQuery:
      name: entity_type
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/CustomFieldEntityType'
    EntityTypeQueryOptional:
      name: entity_type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CustomFieldEntityType'
    OwnerId:
      name: owner_id
      in: query
      schema:
        type: string
        format: uuid
    LinkedPage:
      name: linked_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LinkedLimit:
      name: linked_limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    LinkedType:
      name: type
      in: query
      schema:
        type: string
    LinkedRole:
      name: role
      in: query
      schema:
        type: string
    LinkedSince:
      name: since
      in: query
      schema:
        type: string
        format: date-time

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    Problem:
      type: object
      description: RFC 7807 Problem Details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    # ── Module Configuration ───────────────────────────────────────────────

    CustomFieldEntityType:
      type: string
      enum: [account, contact, lead, deal, ticket]

    ModuleLayoutFieldSource:
      type: string
      enum: [standard, custom]

    ModuleLayoutField:
      type: object
      required: [source, field_key, label, visible, required, order, quick_create, mass_edit, header, key_field]
      properties:
        source:
          $ref: '#/components/schemas/ModuleLayoutFieldSource'
        field_key:
          type: string
        label:
          type: string
        visible:
          type: boolean
        required:
          type: boolean
        order:
          type: integer
        quick_create:
          type: boolean
        mass_edit:
          type: boolean
        header:
          type: boolean
        key_field:
          type: boolean

    ModuleLayoutBlock:
      type: object
      required: [id, label, order, fields]
      properties:
        id:
          type: string
        label:
          type: string
        order:
          type: integer
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ModuleLayoutField'

    ModuleLayout:
      type: object
      required: [entity_type, blocks]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        entity_type:
          $ref: '#/components/schemas/CustomFieldEntityType'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ModuleLayoutBlock'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RelationshipCardinality:
      type: string
      enum: [one_to_one, many_to_one, one_to_many, many_to_many]

    RelationshipStorageStrategy:
      type: string
      enum: [native, crm_entity_links]

    ModuleRelationshipDefinition:
      type: object
      required: [relationship_key, from_entity_type, to_entity_type, label, cardinality, storage_strategy, is_enabled, system_locked, order_idx]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        relationship_key:
          type: string
        from_entity_type:
          $ref: '#/components/schemas/CustomFieldEntityType'
        to_entity_type:
          $ref: '#/components/schemas/CustomFieldEntityType'
        label:
          type: string
        cardinality:
          $ref: '#/components/schemas/RelationshipCardinality'
        storage_strategy:
          $ref: '#/components/schemas/RelationshipStorageStrategy'
        is_enabled:
          type: boolean
        system_locked:
          type: boolean
        order_idx:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CRMEntityLink:
      type: object
      required: [id, org_id, from_entity_type, from_entity_id, to_entity_type, to_entity_id, link_type, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        relationship_definition_id:
          type: string
          format: uuid
        from_entity_type:
          $ref: '#/components/schemas/CustomFieldEntityType'
        from_entity_id:
          type: string
          format: uuid
        to_entity_type:
          $ref: '#/components/schemas/CustomFieldEntityType'
        to_entity_id:
          type: string
          format: uuid
        link_type:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCRMEntityLinkRequest:
      type: object
      required: [relationship_definition_id, from_entity_type, from_entity_id, to_entity_type, to_entity_id]
      properties:
        relationship_definition_id:
          type: string
          format: uuid
        from_entity_type:
          $ref: '#/components/schemas/CustomFieldEntityType'
        from_entity_id:
          type: string
          format: uuid
        to_entity_type:
          $ref: '#/components/schemas/CustomFieldEntityType'
        to_entity_id:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: true

    # ── Auth ────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Seconds until access token expires

    # ── User ────────────────────────────────────────────────────────────────

    UserRole:
      type: string
      enum: [admin, user, viewer]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserPatch:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        avatar_url:
          type: string
          nullable: true

    UserList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'

    # ── Contact ─────────────────────────────────────────────────────────────

    ContactStage:
      type: string
      enum: [lead, prospect, customer, churned]

    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        account_id:
          type: string
          format: uuid
          nullable: true
        owner_id:
          type: string
          format: uuid
        lead_source:
          type: string
          nullable: true
        stage:
          $ref: '#/components/schemas/ContactStage'
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContactCreate:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        account_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        lead_source:
          type: string
        stage:
          $ref: '#/components/schemas/ContactStage'
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true

    ContactPatch:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        account_id:
          type: string
          format: uuid
          nullable: true
        owner_id:
          type: string
          format: uuid
        lead_source:
          type: string
          nullable: true
        stage:
          $ref: '#/components/schemas/ContactStage'
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true

    ContactList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Contact'

    LinkedEntity:
      type: object
      required: [type, id, role, source, created_at]
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        role:
          type: string
        source:
          type: string
        created_at:
          type: string
          format: date-time

    LinkedEntitiesMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ContactDetail:
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          properties:
            linked_entities:
              type: array
              items:
                $ref: '#/components/schemas/LinkedEntity'
            associations:
              description: Deprecated compatibility alias for linked_entities.
              type: array
              items:
                $ref: '#/components/schemas/LinkedEntity'
            linked_entities_meta:
              $ref: '#/components/schemas/LinkedEntitiesMeta'

    # ── Account ─────────────────────────────────────────────────────────────

    AccountSize:
      type: string
      enum: [1-10, 11-50, 51-200, 201-500, 501-1000, 1001-5000, 5000+]

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        size:
          $ref: '#/components/schemas/AccountSize'
          nullable: true
        owner_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
        size:
          $ref: '#/components/schemas/AccountSize'
        owner_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true

    AccountPatch:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        size:
          $ref: '#/components/schemas/AccountSize'
          nullable: true
        owner_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true

    AccountList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Account'

    AccountDetail:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            linked_entities:
              type: array
              items:
                $ref: '#/components/schemas/LinkedEntity'
            associations:
              description: Deprecated compatibility alias for linked_entities.
              type: array
              items:
                $ref: '#/components/schemas/LinkedEntity'
            linked_entities_meta:
              $ref: '#/components/schemas/LinkedEntitiesMeta'

    # ── Deal ────────────────────────────────────────────────────────────────

    DealStage:
      type: string
      enum: [lead, qualified, proposal, negotiation, closed_won, closed_lost]

    Deal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        value_cents:
          type: integer
          format: int64
        currency:
          type: string
          example: USD
        stage:
          $ref: '#/components/schemas/DealStage'
        probability:
          type: integer
          minimum: 0
          maximum: 100
        expected_close_date:
          type: string
          format: date
          nullable: true
        contact_id:
          type: string
          format: uuid
          nullable: true
        account_id:
          type: string
          format: uuid
          nullable: true
        owner_id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        custom_fields:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DealCreate:
      type: object
      required: [title, pipeline_id]
      properties:
        title:
          type: string
        value_cents:
          type: integer
          format: int64
          default: 0
        currency:
          type: string
          default: USD
        stage:
          $ref: '#/components/schemas/DealStage'
        probability:
          type: integer
          minimum: 0
          maximum: 100
        expected_close_date:
          type: string
          format: date
        contact_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        custom_fields:
          type: object
          additionalProperties: true

    DealPatch:
      type: object
      properties:
        title:
          type: string
        value_cents:
          type: integer
          format: int64
        currency:
          type: string
        stage:
          $ref: '#/components/schemas/DealStage'
        probability:
          type: integer
          minimum: 0
          maximum: 100
        expected_close_date:
          type: string
          format: date
          nullable: true
        contact_id:
          type: string
          format: uuid
          nullable: true
        account_id:
          type: string
          format: uuid
          nullable: true
        owner_id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        custom_fields:
          type: object
          additionalProperties: true

    DealList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Deal'

    # ── Activity ────────────────────────────────────────────────────────────

    ActivityType:
      type: string
      enum: [call, meeting, task, email, note]

    ActivityStatus:
      type: string
      enum: [pending, completed, cancelled]

    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ActivityType'
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ActivityStatus'
        due_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        contact_id:
          type: string
          format: uuid
          nullable: true
        account_id:
          type: string
          format: uuid
          nullable: true
        deal_id:
          type: string
          format: uuid
          nullable: true
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ActivityCreate:
      type: object
      required: [type, title]
      properties:
        type:
          $ref: '#/components/schemas/ActivityType'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ActivityStatus'
        due_at:
          type: string
          format: date-time
        contact_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        deal_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid

    ActivityPatch:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ActivityStatus'
        due_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    ActivityList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Activity'

    # ── Pipeline ────────────────────────────────────────────────────────────

    PipelineStage:
      type: object
      required: [id, name, order]
      properties:
        id:
          type: string
        name:
          type: string
        order:
          type: integer
        win_probability:
          type: integer
          minimum: 0
          maximum: 100

    Pipeline:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PipelineCreate:
      type: object
      required: [name, stages]
      properties:
        name:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'

    PipelinePatch:
      type: object
      properties:
        name:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'

    # ── Notes ────────────────────────────────────────────────────────────────

    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        author_id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [contact, account, deal, activity]
        entity_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NoteCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string

    NoteList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Note'

    # ── Search ───────────────────────────────────────────────────────────────

    SearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [contact, account, deal, activity]
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        url:
          type: string

    SearchResults:
      type: object
      properties:
        query:
          type: string
        total:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'

    # ── Shared ───────────────────────────────────────────────────────────────

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer
