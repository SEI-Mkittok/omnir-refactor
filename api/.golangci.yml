run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/omnir/crm-api
  gosec:
    excludes:
      - G401  # MD5/SHA1 — we use JWT, not these
      - G501

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
